name: Android CI - Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure gradle-wrapper.jar is present and authentic
        # gradle-wrapper.jar is a binary that isn't safely hand-authored, so we
        # (re)generate it here from the pinned version in
        # gradle/wrapper/gradle-wrapper.properties using the runner's system
        # Gradle. This keeps gradlew/gradlew.bat/gradle-wrapper.properties as
        # the committed source of truth and guarantees an authentic jar every run.
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaamsetu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
